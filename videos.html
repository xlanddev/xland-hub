<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ویدیوها | Xland Support</title>

    <link rel="icon" type="image/png" href="xland-icon.png">

    <link rel="stylesheet" href="videos.css">
</head>

<body>

    <header class="videos-header">
        <div class="videos-title">
    <img 
        src="xland-icon.png" 
        alt="Xland Support"
        class="xland-support-logo"
    >

    <h1>🎬 ویدیوهای Xland</h1>
</div>
        <p>ویدیوها و آموزش‌های Xland Support</p>
    </header>

    <main class="videos-container">

        <!-- ویدیوهای بلند -->
        <section class="video-section">

            <div class="section-title">
                <h2>🎬 ویدیوهای بلند</h2>
                <p>ویدیوهای کامل و آموزش‌های Xland</p>
            </div>

            <div id="long-videos" class="video-grid">
                <!-- ویدیوها توسط video.js اضافه می‌شوند -->
            </div>

        </section>


        <!-- جداکننده -->
        <div class="video-divider"></div>


        <!-- ویدیوهای شورت -->
        <section class="video-section">

            <div class="section-title">
                <h2>📱 ویدیو شورت</h2>
                <p>ویدیوهای کوتاه و جذاب Xland</p>
            </div>

            <div id="short-videos" class="video-grid shorts-grid">
                <!-- شورت‌ها توسط video.js اضافه می‌شوند -->
            </div>

        </section>

    </main>

    <script src="security.js"></script>
    <script src="video.js"></script>
    

</body>
</html>
