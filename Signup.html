<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Xland Script</title>

    <link rel="stylesheet" href="signup.css">

    <link rel="icon" href="xland-icon.png">


</head>

<body>

<body>
    


<div class="auth-container">


    <!-- Left Panel -->

    <div class="welcome-panel">


        <div class="welcome-content">


    <img 
    src="xland-icon.png"
    class="xland-logo"
    alt="Xland Logo">


    <h1>

        🚀 Join XLAND

    </h1>


    <p>

        Create your account and
        access Xland developer resources.

    </p>




            <a href="signin.html">

                <button>

                    Sign In

                </button>

            </a>


        </div>


    </div>



    <!-- Right Panel -->

    <div class="login-panel">


        <h2>

            📝 Create Account

        </h2>



        <input
    type="email"
    id="email"
    placeholder="Email"
    autocomplete="email">

<input
    type="text"
    id="username"
    placeholder="Username"
    autocomplete="username">

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="new-password">

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm Password"
    autocomplete="new-password">



        <button id="createAccountBtn">

            Create Account

        </button>



        <p>



</div>


<script src="security.js"></script>
<script src="signup.js"></script>


</body>

</body>

</html>
