<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Xland Script</title>

    <link rel="stylesheet" href="signin.css">

    <link rel="icon" href="xland-icon.png">

</head>

<body>

<body>


<div class="auth-container">


    <!-- Left Panel -->

    <div class="welcome-panel">


        <div class="welcome-content">


            <h1>

                🚀 Welcome to XLAND

            </h1>


            <p>

                Access Xland Scripts,
                Developer Tools and Community.

            </p>


            <a href="Signup.html">

                <button>

                    Create Account

                </button>

            </a>


        </div>


    </div>



    <!-- Right Panel -->


    <div class="login-panel">


        <h2>

            👤 Sign In

        </h2>


        <input
        type="text"
        id="username"
        placeholder="Username">


        <input
        type="password"
        id="password"
        placeholder="Password">


        <button id="loginBtn">

            Sign In

        </button>



        <p>




    </div>


</div>


<script src="security.js"></script>
<script src="signin.js"></script>


</body>

</body>

</html>
